build:
  dev:
    context: .
    target: dev
  hello-world:
    context: .
    target: prod
    depends_on:
      - dev

deploy:
  - envsubst < k8s.yml | kubectl apply -f -

test:
  unit:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    caches:
      - /root/.nuget/packages
    commands:
      - dotnet test --project tests --report-xunit-trx --report-xunit-trx-filename test-results.trx --results-directory .
    artifacts:
      - test-results.trx

dev:
  hello-world:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: dotnet watch
    sync:
      - .:/usr/src/app
    persistentVolume:
      enabled: false
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
