name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          push: false
          target: dev
          context: .
      - name: Build prod image
        uses: docker/build-push-action@v7
        with:
          push: false
          target: prod
          context: .
